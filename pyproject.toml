[project]
name = "venturekeep"
version = "0.9.0"  # cosmetic only; VERSION and git tags are the source of truth, see .claude/rules/versioning.md
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.1",
    "sqlalchemy==2.0.48",
    "uvicorn==0.41.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.31",
    "python-jose[cryptography]==3.5.0",
    "bcrypt==5.0.0",
    "alembic==1.18.4",
    "psycopg2-binary==2.9.10",
    "sentry-sdk[fastapi]==2.69.1",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "httpx==0.28.1",
]

[tool.uv]
package = false  # an application, not a library; nothing imports venturekeep as a package

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends pattern)
    "E712",   # == True/False comparisons — intentional for SQLAlchemy filter expressions
    "SIM108", # ternary suggestions — readability preference
    "SIM116", # dict instead of if/elif — readability preference
    "UP042",  # StrEnum suggestion — keep str+Enum for broader compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
